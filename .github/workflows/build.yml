name: build
on:
  push:
    branches:
      - trunk
  pull_request:
  merge_group:
  schedule:
    # Nightly builds against react-native@nightly at 4:00, Monday through Friday
    - cron: 0 4 * * 1-5
env:
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  NODE_OPTIONS: "--disable-proto=delete"
  VisualStudioVersion: "17.0"
  WindowsTargetPlatformVersion: "10.0.26100.0"
concurrency:
  # Ensure single build of a pull request. `trunk` should not be affected.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  lint-commit:
    name: "lint commit message"
    permissions: {}
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Lint commit message
        run: |
          node --run lint:commit
  review:
    permissions:
      issues: write # comment on PRs (suggestion-bot)
      pull-requests: write # create code reviews (suggestion-bot)
    strategy:
      matrix:
        runner: [macos-26, windows-2025]
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event_name != 'schedule' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          platform: node
      - name: Deduplicate packages
        run: |
          yarn dedupe --check
      - name: Install npm dependencies
        uses: ./.github/actions/yarn
      - name: Lint dependencies
        run: |
          yarn rnx-align-deps
      - name: Lint lockfile
        run: |
          yarn lint-lockfile
      - name: Report unused dependencies
        if: ${{ github.event_name == 'pull_request' && runner.os == 'macOS' }}
        run: |
          yarn knip
      - name: Validate generated files
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          yarn generate:code
          yarn generate:schema
          if [[ -n "$GITHUB_TOKEN" ]]; then
            git diff | yarn suggestion-bot
          fi
          git diff --exit-code
        shell: bash
        working-directory: packages/app
      - name: ClangFormat
        if: ${{ github.event_name == 'pull_request' && runner.os == 'macOS' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # TODO: GITHUB_TOKEN is not set if a PR comes from a forked repo.
          #       Ignore errors until we can create a GitHub PAT from a system
          #       account.
          scripts/clang-format-diff.sh || true
      - name: CocoaPods
        if: ${{ runner.os == 'macOS' }}
        run: |
          echo "::add-matcher::.github/rubocop.json"
          yarn lint:rb
          echo "::remove-matcher owner=rubocop::"
          echo "::add-matcher::.github/minitest.json"
          yarn test:rb
          echo "::remove-matcher owner=minitest::"
        working-directory: packages/app
      - name: Populate Gradle cache
        uses: ./.github/actions/gradle
        with:
          arguments: clean
          project-root: packages/app/example
      - name: JavaScript
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # TODO: GITHUB_TOKEN is not set if a PR comes from a forked repo.
          #       Ignore errors until we can create a GitHub PAT from a system
          #       account.
          if [[ ${{ runner.os }} == macOS ]]; then
            yarn format:js
            if [[ -n "$GITHUB_TOKEN" ]]; then
              git diff | yarn suggestion-bot
            else
              git diff
            fi
            git diff --exit-code
            yarn lint:js
          fi
          yarn tsc
          yarn test:js
        shell: bash
        working-directory: packages/app
      - name: ktlint
        if: ${{ github.event_name == 'pull_request' && runner.os == 'macOS' }}
        run: |
          brew install ktlint
          echo "::add-matcher::.github/ktlint.json"
          yarn lint:kt
          echo "::remove-matcher owner=ktlint::"
        working-directory: packages/app
      - name: SwiftFormat
        if: ${{ github.event_name == 'pull_request' && runner.os == 'macOS' }}
        run: |
          echo "::add-matcher::.github/swiftformat.json"
          yarn format:swift --lint
          echo "::remove-matcher owner=swiftformat::"
        working-directory: packages/app
      - name: SwiftLint
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install swiftlint
          echo "::add-matcher::.github/swiftlint.json"
          swiftlint
          echo "::remove-matcher owner=swiftlint::"
        working-directory: packages/app
      - name: Smoke test `npx --package react-native-test-app@latest init`
        run: |
          node ./react-native-test-app/packages/app/scripts/init.mjs --destination app --name App -p android -p ios -p macos -p windows
        working-directory: ..
      - name: Smoke test `setup-react-native` action
        uses: ./.github/actions/setup-react-native
        with:
          version: nightly
    timeout-minutes: 60
  ios:
    name: "iOS"
    permissions: {}
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          platform: ios
          project-root: packages/app/example
          cache-key-prefix: example
      - name: Set up react-native@nightly
        if: ${{ github.event_name == 'schedule' }}
        uses: ./.github/actions/setup-react-native
        with:
          version: nightly
      - name: Install npm dependencies
        uses: ./.github/actions/yarn
        with:
          immutable: ${{ github.event_name != 'schedule' }}
      - name: Bundle JavaScript
        run: |
          yarn build:ios
        working-directory: packages/app/example
      - name: Determine whether the iOS app needs to be built
        id: affected
        uses: ./.github/actions/affected
      - name: Install Pods
        if: ${{ steps.affected.outputs.ios != '' }}
        uses: ./.github/actions/cocoapods
        with:
          project-directory: ios
          working-directory: packages/app/example
      - name: Build
        if: ${{ steps.affected.outputs.ios != '' }}
        run: |
          ../../../scripts/xcodebuild.sh ios/Example.xcworkspace build-for-testing
        working-directory: packages/app/example
      - name: Test `react-native config`
        if: ${{ steps.affected.outputs.ios != '' }}
        run: |
          node --test test/config.test.mjs
        working-directory: packages/app/example
      - name: Test
        if: ${{ steps.affected.outputs.ios != '' }}
        run: |
          ../../../scripts/xcodebuild.sh ios/Example.xcworkspace test-without-building
        working-directory: packages/app/example
    timeout-minutes: 60
  ios-template:
    name: "iOS [template]"
    permissions: {}
    runs-on: macos-26
    if: ${{ github.event_name != 'schedule' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          platform: ios
          project-root: packages/app/example
          cache-key-prefix: template-${{ matrix.template }}
      - name: Initialize test app
        uses: ./.github/actions/init-test-app
        with:
          arguments: -p android -p ios
      - name: Bundle JavaScript
        run: |
          yarn build:ios
        working-directory: template-example
      - name: Determine whether the iOS app needs to be built
        id: affected
        uses: ./.github/actions/affected
      - name: Install Pods
        if: ${{ steps.affected.outputs.ios != '' }}
        run: |
          pod install --project-directory=ios
        working-directory: template-example
      - name: Build
        if: ${{ steps.affected.outputs.ios != '' }}
        run: |
          ../scripts/xcodebuild.sh ios/TemplateExample.xcworkspace build
        working-directory: template-example
      - name: react-native run-ios
        if: ${{ steps.affected.outputs.ios != '' }}
        run: |
          ../scripts/react-native.ts run-ios
        working-directory: template-example
    timeout-minutes: 60
  android:
    name: "Android"
    permissions: {}
    strategy:
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          platform: android
      - name: Set up react-native@nightly
        if: ${{ github.event_name == 'schedule' }}
        uses: ./.github/actions/setup-react-native
        with:
          version: nightly
      - name: Install npm dependencies
        uses: ./.github/actions/yarn
        with:
          immutable: ${{ github.event_name != 'schedule' }}
      - name: Test `react-native config`
        run: |
          node --test test/config.test.mjs
        working-directory: packages/app/example
      - name: Bundle JavaScript
        # Metro on nightlies currently fails with "SHA-1 for file index.js is
        # not computed" so we'll skip this step for now.
        if: ${{ github.event_name != 'schedule' || runner.os != 'Windows' }}
        run: |
          yarn build:android
        shell: bash
        working-directory: packages/app/example
      - name: Determine whether the Android app needs to be built
        id: affected
        # Nightlies currently fail on Windows because of wrong path separators.
        if: ${{ github.event_name != 'schedule' || runner.os != 'Windows' }}
        uses: ./.github/actions/affected
      - name: Build
        if: ${{ steps.affected.outputs.android != '' }}
        uses: ./.github/actions/gradle
        with:
          project-root: packages/app/example
    timeout-minutes: 60
  android-template:
    name: "Android [template]"
    permissions: {}
    strategy:
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event_name != 'schedule' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          platform: android
      - name: Initialize test app
        uses: ./.github/actions/init-test-app
        with:
          arguments: -p android -p ios
      - name: Bundle JavaScript
        run: |
          yarn build:android
        shell: bash
        working-directory: template-example
      - name: Determine whether the Android app needs to be built
        id: affected
        uses: ./.github/actions/affected
      - name: Build
        if: ${{ steps.affected.outputs.android != '' }}
        uses: ./.github/actions/gradle
        with:
          project-root: template-example
      - name: react-native run-android
        if: ${{ steps.affected.outputs.android != '' }}
        run: |
          ../scripts/react-native.ts run-android
        working-directory: template-example
    timeout-minutes: 60
  macos:
    name: "macOS"
    permissions: {}
    runs-on: macos-26
    if: ${{ github.event_name != 'schedule' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          platform: macos
          project-root: packages/example-macos
          cache-key-prefix: example
      - name: Set up react-native@canary
        if: ${{ github.event_name == 'schedule' }}
        uses: ./.github/actions/setup-react-native
        with:
          version: canary-macos
      - name: Install npm dependencies
        uses: ./.github/actions/yarn
        with:
          immutable: ${{ github.event_name != 'schedule' }}
      - name: Bundle JavaScript
        run: |
          yarn build:macos
        working-directory: packages/example-macos
      - name: Determine whether the macOS app needs to be built
        id: affected
        uses: ./.github/actions/affected
      - name: Install Pods
        if: ${{ steps.affected.outputs.macos != '' }}
        uses: ./.github/actions/cocoapods
        with:
          project-directory: macos
          working-directory: packages/example-macos
      - name: Build
        if: ${{ steps.affected.outputs.macos != '' }}
        run: |
          ../../scripts/xcodebuild.sh macos/Example.xcworkspace build-for-testing
        working-directory: packages/example-macos
      - name: Test `react-native config`
        if: ${{ steps.affected.outputs.macos != '' }}
        run: |
          node --test test/config.test.mjs
        working-directory: packages/example-macos
      - name: Test
        if: ${{ steps.affected.outputs.macos != '' && github.event_name != 'schedule' }}
        run: |
          ../../scripts/xcodebuild.sh macos/Example.xcworkspace test-without-building
        working-directory: packages/example-macos
    timeout-minutes: 60
  macos-template:
    name: "macOS [template]"
    permissions: {}
    runs-on: macos-26
    if: ${{ github.event_name != 'schedule' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          platform: macos
          project-root: packages/app/example
          cache-key-prefix: template-${{ matrix.template }}
      - name: Initialize test app
        uses: ./.github/actions/init-test-app
        with:
          arguments: -p macos
      - name: Bundle JavaScript
        run: |
          yarn build:macos
        working-directory: template-example
      - name: Determine whether the macOS app needs to be built
        id: affected
        uses: ./.github/actions/affected
      - name: Install Pods
        if: ${{ steps.affected.outputs.macos != '' }}
        run: |
          # TODO: Disable Hermes while build issues are being resolved
          # https://github.com/microsoft/react-native-macos/issues/2499
          sed -i '' 's/:hermes_enabled => true/:hermes_enabled => false/' macos/Podfile
          pod install --project-directory=macos
        working-directory: template-example
      - name: Build
        if: ${{ steps.affected.outputs.macos != '' }}
        run: |
          ../scripts/xcodebuild.sh macos/TemplateExample.xcworkspace build
        working-directory: template-example
    timeout-minutes: 60
  visionos:
    name: "visionOS"
    permissions: {}
    runs-on: macos-26
    if: ${{ github.event_name != 'schedule' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          platform: visionos
          project-root: packages/example-visionos
          cache-key-prefix: example
      - name: Set up react-native@nightly
        if: ${{ github.event_name == 'schedule' }}
        uses: ./.github/actions/setup-react-native
        with:
          version: nightly
      - name: Install npm dependencies
        uses: ./.github/actions/yarn
        with:
          immutable: ${{ github.event_name != 'schedule' }}
      - name: Bundle JavaScript
        run: |
          yarn build:visionos
        working-directory: packages/example-visionos
      - name: Determine whether the visionOS app needs to be built
        id: affected
        uses: ./.github/actions/affected
      - name: Install Pods
        if: ${{ steps.affected.outputs.visionos != '' }}
        uses: ./.github/actions/cocoapods
        with:
          project-directory: visionos
          working-directory: packages/example-visionos
      - name: Build
        if: ${{ steps.affected.outputs.visionos != '' }}
        run: |
          ../../scripts/xcodebuild.sh visionos/Example.xcworkspace build-for-testing
        working-directory: packages/example-visionos
      - name: Test `react-native config`
        if: ${{ steps.affected.outputs.visionos != '' }}
        run: |
          node --test test/config.test.mjs
        working-directory: packages/example-visionos
    timeout-minutes: 60
  visionos-template:
    name: "visionOS [template]"
    permissions: {}
    runs-on: macos-15
    if: false # visionOS temporarily disabled until releases are resumed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          platform: visionos
          project-root: packages/app/example
          cache-key-prefix: template-${{ matrix.template }}
      - name: Initialize test app
        uses: ./.github/actions/init-test-app
        with:
          arguments: -p visionos
      - name: Bundle JavaScript
        run: |
          yarn build:visionos
        working-directory: template-example
      - name: Determine whether the visionOS app needs to be built
        id: affected
        uses: ./.github/actions/affected
      - name: Install Pods
        if: ${{ steps.affected.outputs.visionos != '' }}
        run: |
          pod install --project-directory=visionos
        working-directory: template-example
      - name: Build
        if: ${{ steps.affected.outputs.visionos != '' }}
        run: |
          ../scripts/xcodebuild.sh visionos/TemplateExample.xcworkspace build
        working-directory: template-example
    timeout-minutes: 60
  windows:
    name: "Windows"
    permissions: {}
    runs-on: windows-2022
    if: ${{ github.event_name != 'schedule' }}
    strategy:
      matrix:
        platform: [ARM64, x64]
        configuration: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          platform: windows
      - name: Set up react-native@canary
        if: ${{ github.event_name == 'schedule' }}
        uses: ./.github/actions/setup-react-native
        with:
          version: canary-windows
      - name: Install npm dependencies
        uses: ./.github/actions/yarn
        with:
          immutable: ${{ github.event_name != 'schedule' }}
      - name: Bundle JavaScript
        run: |
          yarn build:windows
        working-directory: packages/example-windows
      - name: Generate Visual Studio solution
        run: |
          node --run prebuild -- --msbuildprops WindowsTargetPlatformVersion=$env:WindowsTargetPlatformVersion
        working-directory: packages/example-windows
      - name: Test `react-native config`
        run: |
          node --test test/config.test.mjs
        working-directory: packages/example-windows
      - name: Determine whether the Windows app needs to be built
        id: affected
        uses: ./.github/actions/affected
      - name: Build
        id: build
        if: ${{ steps.affected.outputs.windows != '' }}
        env:
          # Enable this when debugging Windows builds:
          # https://github.com/dotnet/msbuild/blob/main/documentation/Property-tracking-capabilities.md
          MSBuildLogPropertyTracking: 0
        run: |
          if ("${{ matrix.configuration }}" -eq "Release") {
            yarn ci:windows --release --arch ${{ matrix.platform }}
          } else {
            yarn ci:windows --arch ${{ matrix.platform }}
          }
        working-directory: packages/example-windows
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msbuild.binlog
          path: packages/example-windows/windows/*.binlog
          retention-days: 14
          overwrite: true
      - name: Test
        if: ${{ steps.affected.outputs.windows != '' && matrix.platform == 'x64' }}
        run: |
          ../../../app/scripts/build/MSBuild.ps1 -Configuration ${{ matrix.configuration }} -Platform ${{ matrix.platform }} -Target Build ReactAppTests.vcxproj
          ../../../app/scripts/build/VSTest.ps1 ${{ matrix.platform }}\${{ matrix.configuration }}\ReactAppTests.dll
        working-directory: packages/example-windows/windows/ReactAppTests
    timeout-minutes: 60
  windows-template:
    name: "Windows [template]"
    permissions: {}
    runs-on: windows-2022
    if: ${{ github.event_name != 'schedule' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          platform: windows
      - name: Initialize test app
        uses: ./.github/actions/init-test-app
        with:
          arguments: -p windows --version 0.83.0
      - name: Bundle JavaScript
        run: |
          yarn build:windows
        working-directory: template-example
      - name: Generate Visual Studio solution
        run: |
          yarn install-windows-test-app --msbuildprops WindowsTargetPlatformVersion=$env:WindowsTargetPlatformVersion
        working-directory: template-example
      - name: Determine whether the Windows app needs to be built
        id: affected
        uses: ./.github/actions/affected
      - name: Build
        id: build
        if: ${{ steps.affected.outputs.windows != '' }}
        run: |
          yarn windows --logging --no-packager --no-launch --no-deploy
        working-directory: template-example
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-template-msbuild.binlog
          path: template-example/windows/*.binlog
          retention-days: 14
          overwrite: true
    timeout-minutes: 60
  release:
    permissions:
      contents: write # create releases (Nx Release)
      id-token: write # enable use of OIDC for trusted publishing
    needs:
      - review
      - ios
      - ios-template
      - android
      - android-template
      - macos
      - macos-template
      - windows
      - windows-template
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'schedule' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Install npm dependencies
        uses: ./.github/actions/yarn
      - name: Verify tarball content
        run: |
          node --test test/pack.test.mts
        working-directory: packages/app
      - name: Release (dry run)
        if: ${{ github.ref != 'refs/heads/trunk' }}
        run: |
          yarn nx release --dry-run
      - name: Release
        if: ${{ github.ref == 'refs/heads/trunk' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin trunk
          if git merge-base --is-ancestor origin/trunk HEAD; then
            git config user.email 'github-actions[bot]'
            git config user.name 'github-actions[bot]@users.noreply.github.com'
            yarn nx release --yes
          fi
  autobot:
    name: "Autobot"
    permissions:
      contents: read
      pull-requests: write
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Label
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
        continue-on-error: true
